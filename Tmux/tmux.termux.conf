################################################################################
# Termux configurations only
################################################################################

# Same row as tmux.conf's status-format[1], in the shape tmux.mac.conf sets on
# a Mac. Two facts differ under Android: hostname -s reports `localhost`, so
# the name comes from machine-info, the same file the prompt reads; and the
# charge lives behind the Termux:API companion app (see battery.termux.sh),
# linked into ~/.tmux/battery.sh by install.sh.
set -g status-format[1] '#[align=left]#[fg=blue,bold]#(sed -n s/^PRETTY_HOSTNAME=//p /data/data/com.termux/files/usr/etc/machine-info) #[fg=magenta,nobold]:: #(~/.tmux/battery.sh)#[align=right]#[fg=blue]#S:#I.#P #[fg=yellow]:: %d %b %Y #[fg=green]:: %R'
