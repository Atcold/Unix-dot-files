<!doctype html><html lang="it"><meta charset="utf-8"><meta name="color-scheme" content="only light"><meta name="viewport" content="width=device-width, initial-scale=1"><title>cucina · tablet</title>
<style>:root{color-scheme:only light}html,body{margin:0;height:100%;background:#fff;color:#000}iframe{border:0;width:100%;height:100%;display:none}#welcome{height:100%;display:flex;justify-content:center;align-items:center;text-align:center;font:24px/1.6 Georgia,serif}#status{position:fixed;left:8px;bottom:4px;font:12px monospace;background:white}a{color:#000}</style>
<div id="welcome"><div><strong>cucina</strong><br>Scegli una ricetta dal telefono o dal Mac.<br>Questa pagina la mostrerà qui.<br><a href="/">Cerca su questo dispositivo</a></div></div><iframe id="frame" title="Ricetta"></iframe><div id="status">Connessione…</div>
<script>
var id=Math.random().toString(36).slice(2),seq=null,busy=false;
function status(text){var node=document.createElement('div');node.id='status';node.textContent=text;document.getElementById('status').replaceWith(node)}
function poll(){if(busy)return;busy=true;fetch('/api/screen?watch='+id).then(function(r){if(!r.ok)throw Error();return r.json()}).then(function(state){if(state.slug&&state.seq!==seq){seq=state.seq;document.getElementById('frame').src='/cook?slug='+encodeURIComponent(state.slug);document.getElementById('frame').style.display='block';document.getElementById('welcome').style.display='none'}status('cucina · connesso')}).catch(function(){status('cucina · connessione interrotta, riprovo…')}).finally(function(){busy=false})}poll();setInterval(poll,2000);document.addEventListener('visibilitychange',function(){if(!document.hidden)poll()});
</script></html>
